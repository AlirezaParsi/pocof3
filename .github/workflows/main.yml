name: Test Telegram File Upload with Caption

on:
  workflow_dispatch:
    inputs:
      CODENAME:
        description: 'Phone Codename'
        default: 'alioth'
        required: true

jobs:
  test-upload:
    runs-on: ubuntu-latest
    environment: Telegram
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Build Date
        id: build_date
        run: |
          build_date=$(date +"%Y%m%d")  # Only date, no time
          echo "build_date=$build_date" >> $GITHUB_OUTPUT

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Download and Prepare Thumbnail
        run: |
          # Download the new thumbnail
          curl -o custom_thumbnail.jpg "https://raw.githubusercontent.com/AlirezaParsi/pocof3/refs/heads/base/Picsart_25-03-10_00-15-43-611.jpg"

          # Resize and convert the thumbnail to meet Telegram's requirements
          convert custom_thumbnail.jpg -resize 320x320 -quality 80 -format jpg custom_thumbnail.jpg

          # Debug: Check the size and dimensions of the thumbnail
          identify custom_thumbnail.jpg

      - name: Create a Dummy ZIP File
        run: |
          mkdir -p dummy_files
          echo "This is a test file for Telegram upload." > dummy_files/test.txt
          zip -r test_upload.zip dummy_files
          echo "zipname=test_upload.zip" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot

      - name: Run Python script to upload file
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_CODENAME: ${{ github.event.inputs.CODENAME }}
          BUILD_DATE: ${{ steps.build_date.outputs.build_date }}
        run: |
          python upload_to_telegram.py
