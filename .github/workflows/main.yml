name: Create Fake ZIP and Upload to Telegram

on:
  workflow_dispatch:
    inputs:
      UPLOAD_TO_RELEASE:
        description: 'Upload to release'
        type: boolean
        default: false

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    environment: Telegram
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Create a fake ZIP file
      run: |
        # Create a temporary directory
        mkdir -p fake_kernel

        # Create a fake file inside the directory
        echo "This is a fake kernel file for testing." > fake_kernel/fake_kernel.txt

        # Zip the directory
        zip -r fake_kernel.zip fake_kernel

        # Debug: List files
        ls -lh

    - name: Determine Telegram Caption
      id: caption
      run: |
        # Determine the tag based on UPLOAD_TO_RELEASE
        if ${{ github.event.inputs.UPLOAD_TO_RELEASE == 'true' }}; then
          build_tag="#release"
        else
          build_tag="#CI"
        fi

        # Construct the full caption (properly formatted)
        full_caption="#ALPKernel #alioth $build_tag \n <a href='https://t.me/ALPkernel/128'>flashing guide</a>"

        # Output the caption for use in the next step
        echo "full_caption=$full_caption" >> $GITHUB_OUTPUT

    - name: Debug Telegram Secrets
      run: |
        echo "TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}"
        echo "TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}"

    - name: Upload Fake ZIP to Telegram
      run: |
        # Debug: Print the caption being sent
        echo "Sending Caption:"
        echo "${{ steps.caption.outputs.full_caption }}"

        # Upload the file to Telegram
        curl -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
             -F document=@"fake_kernel.zip" \
             -F caption="${{ steps.caption.outputs.full_caption }}" \
             -F parse_mode="HTML" \
             https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument

    - name: Upload to Release (Debug - Disabled)
      if: ${{ github.event.inputs.UPLOAD_TO_RELEASE == 'true' }}
      run: |
        echo "Debug mode: Skipping release upload to avoid cluttering releases."
